<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>VEKTOR</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <p class="eyebrow">VEKTOR</p>
      <h1>Meme Launcher</h1>
      <p class="copy">Open X, find a post, and tap the VEKTOR overlay to generate a token launch plan.</p>

      <label>
        Wallet address
        <input id="walletAddress" placeholder="0x..." />
      </label>
      <label>
        Orbio LLM endpoint
        <input id="orbioEndpoint" placeholder="https://..." />
      </label>
      <label>
        Orbio API key
        <input id="orbioApiKey" type="password" placeholder="optional" />
      </label>

      <button id="save">Save settings</button>
      <p id="status"></p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
